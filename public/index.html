<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curriculum Tree</title>
<style>
:root {
  /* Layout idea: one indented outline of cards; each unit owns a hue that fades with depth. */
  --bg: #f1f2f7; --paper: #ffffff; --ink: #1b1e2e; --muted: #5a607a; --line: #d6d9e6;
  --good: hsl(162 60% 30%); --notyet: hsl(36 90% 36%); --gold: hsl(44 95% 56%); --goldbg: hsl(44 95% 56% / .22);
  --sat: 64%; --l1: 88%; --l2: 93%; --l3: 96.5%; --lr: 40%; --lt: 22%; --track: rgba(27, 30, 46, .13);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --math: "Cambria Math", "STIX Two Math", Cambria, Georgia, serif;
  --fs-s: .84rem; --fs-m: 1rem; --fs-l: 1.3rem;
  --shadow: 0 1px 2px rgba(20, 24, 50, .08), 0 3px 10px rgba(20, 24, 50, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #12141c; --paper: #1b1e2a; --ink: #e9ebf4; --muted: #a2a8c0; --line: #2d3145;
    --good: hsl(162 52% 62%); --notyet: hsl(40 85% 64%);
    --sat: 34%; --l1: 25%; --l2: 20.5%; --l3: 17%; --lr: 68%; --lt: 88%; --track: rgba(233, 235, 244, .16);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12141c; --paper: #1b1e2a; --ink: #e9ebf4; --muted: #a2a8c0; --line: #2d3145;
  --good: hsl(162 52% 62%); --notyet: hsl(40 85% 64%);
  --sat: 34%; --l1: 25%; --l2: 20.5%; --l3: 17%; --lr: 68%; --lt: 88%; --track: rgba(233, 235, 244, .16);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
}
* { box-sizing: border-box; }
html { font-size: 17px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: var(--fs-m)/1.45 var(--font); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 2.5px solid hsl(var(--h, 230) 70% 50%); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.quiet { color: var(--muted); font-size: var(--fs-s); }

header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 900px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
#coursename { font-size: var(--fs-l); font-weight: 700; letter-spacing: -.01em; }
#crumb { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; flex: 1; min-width: 0; font-size: var(--fs-s); }
.crumb { border: 0; background: none; padding: 3px 6px; border-radius: 6px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.crumb:hover { color: var(--ink); }
.sep { color: var(--muted); } .here { font-weight: 600; padding: 3px 4px; }
#flaglist { max-width: 900px; margin: 0 auto; padding: 0 16px 10px; display: flex; flex-wrap: wrap; gap: 6px; }
#flaglist[hidden] { display: none; }

main { max-width: 900px; margin: 0 auto; padding: 16px 16px 40px; }
.node { --card: hsl(var(--h) var(--sat) var(--l2)); --ringc: hsl(var(--h) 62% var(--lr)); display: flex; flex-direction: column; gap: 8px; }
.node.d0, .node.d-1 { --card: var(--paper); } .d-1 > .card .title { font-size: var(--fs-l); } .node.d1 { --card: hsl(var(--h) var(--sat) var(--l1)); } .node.d3 { --card: hsl(var(--h) var(--sat) var(--l3)); }
.card { display: flex; gap: 12px; align-items: center; padding: 11px 12px 11px 14px; border-radius: 13px; background: var(--card); box-shadow: var(--shadow); cursor: pointer; min-height: 48px; }
.node.top > .card { cursor: default; }
.node.leaf.top > .card { cursor: pointer; }
.txt { flex: 1; min-width: 0; }
.title { font-weight: 650; color: hsl(var(--h) 45% var(--lt)); }
.d0 > .card .title, .d1 > .card .title { font-size: var(--fs-l); letter-spacing: -.01em; line-height: 1.2; }
.can { font-size: var(--fs-s); color: var(--muted); margin-top: 1px; }
.acts { display: flex; gap: 6px; flex: none; }
.act { border: 1px solid hsl(var(--h) 30% 50% / .35); background: hsl(var(--h) 40% 50% / .08); border-radius: 9px; padding: 6px 10px; font-size: var(--fs-s); font-weight: 600; min-height: 34px; }
.act:hover:not(:disabled) { background: hsl(var(--h) 50% 50% / .2); }

.kids { display: flex; flex-direction: column; gap: 8px; margin-left: 13px; padding-left: 13px; border-left: 3px solid hsl(var(--h) 50% 55% / .3); }
.node.top.d-1 > .kids, .node.top.d0 > .kids { margin-left: 0; padding-left: 0; border-left: 0; }
.node:not(.open) > .kids, .node:not(.open) > .body, .node:not(.open) > .face, .node[data-mode="check"] > .kids, .node[data-mode="check"] > .body, .node[data-mode="expo"] > .face, .kids:empty, .body:empty { display: none; }
.body, .face { margin-left: 13px; padding: 14px 16px; border-radius: 13px; background: var(--paper); border-left: 3px solid var(--ringc); box-shadow: var(--shadow); }
.bite { margin: 0; max-width: 66ch; font-size: 1.04rem; line-height: 1.6; }
.bitefoot { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; margin-top: 12px; }
.links { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.node.flagged > .card .title::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 8px; border-radius: 50%; background: var(--notyet); vertical-align: middle; }

@property --s { syntax: '<number>'; inherits: false; initial-value: 0; }
@property --f { syntax: '<number>'; inherits: false; initial-value: 0; }
/* Progress marks keep one neutral look in every unit, so they read the same against any card color. */
.mark { flex: none; position: relative; width: 26px; height: 26px; border-radius: 50%; --s: 0; --f: 0;
  background: conic-gradient(var(--ink) calc(var(--s) * 1turn), color-mix(in srgb, var(--ink) 34%, var(--paper)) 0 calc(var(--f) * 1turn), var(--paper) 0);
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ink) 45%, transparent); transition: --s .5s ease, --f .5s ease; }
.mark.seen { box-shadow: inset 0 0 0 2.5px var(--ink); }
.mark.full { background: var(--good); box-shadow: none; }
.mark.full::after { content: ""; position: absolute; left: 9px; top: 4.5px; width: 6px; height: 12px; border: solid var(--paper); border-width: 0 3px 3px 0; transform: rotate(45deg); }
.seg { display: inline-flex; border: 1px solid hsl(var(--h) 30% 50% / .35); border-radius: 10px; overflow: hidden; background: hsl(var(--h) 40% 50% / .08); }
.segb { border: 0; background: none; padding: 6px 11px; font-size: var(--fs-s); font-weight: 600; min-height: 34px; color: var(--muted); }
.segb:hover:not(:disabled):not([aria-checked="true"]) { background: hsl(var(--h) 50% 50% / .16); }
.segb[aria-checked="true"] { background: hsl(var(--h) 55% var(--lr)); color: var(--paper); }
.node.top > .card .act.focus { display: none; }
.facehead { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; min-height: 22px; }
.facehead .linkbtn { margin-left: auto; }
.linkbtn { border: 0; background: none; padding: 2px 0; color: var(--muted); font-size: var(--fs-s); text-decoration: underline; text-underline-offset: 3px; }
.linkbtn:hover { color: var(--ink); }
.qlist { display: grid; gap: 18px; }
.q + .q { border-top: 1px dashed var(--line); padding-top: 16px; }
.facefoot { margin-top: 16px; } .facefoot:empty { display: none; }
.qtools { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: flex-start; }
.rank { display: flex; align-items: flex-start; margin-top: 10px; }
.bandwrap { flex: none; } .band { display: block; }
.band .axis { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; } .band .tick { stroke: var(--muted); stroke-width: 1; }
.band .lead { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 3; } .band .dot { fill: var(--ink); }
.slots { display: flex; flex-direction: column; min-width: 0; }
.slotrow { display: flex; align-items: center; gap: 10px; }
.slotlab { min-width: 3.4em; font-weight: 650; font-variant-numeric: tabular-nums; }
.slot { min-width: 190px; min-height: 42px; border: 2px dashed var(--line); border-radius: 999px; display: flex; align-items: center; padding: 3px; }
.slot.ok { border: 2px solid var(--good); } .slot.no { border: 2px solid var(--notyet); }
.slotrow .ans { font-size: var(--fs-s); font-weight: 600; color: var(--good); }
.tray { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; padding: 7px; border-radius: 12px; background: var(--track); }
.tray.needs { outline: 2px solid var(--notyet); }
.chip.drag { touch-action: none; cursor: grab; user-select: none; background: var(--paper); font-size: var(--fs-m); padding: 5px 14px; }
.chip.drag:disabled { opacity: 1; cursor: default; }
.chip.sel { outline: 2.5px solid hsl(var(--h, 230) 70% 50%); outline-offset: 1px; }
.chip.dragging { position: relative; z-index: 20; box-shadow: 0 6px 18px rgba(0, 0, 0, .25); cursor: grabbing; }

.given { display: inline; padding: 0 5px; border: 1.5px solid hsl(var(--h, 230) 45% 50% / .6); border-radius: 6px; background: hsl(var(--h, 230) 60% 50% / .07); white-space: nowrap; font-variant-numeric: tabular-nums;
  -webkit-box-decoration-break: slice; box-decoration-break: slice; }
/* An opened unit is ordinary text inside its box: the line is laid out again, and a box that meets the right margin is cut there and goes on below. */
.given.gopen { white-space: normal; }
.u { cursor: pointer; } .u .ut { display: none; } .u.open .us { display: none; } .u.open .ut { display: inline; } .wd { display: inline-block; }
.linkbtn { border: 0; background: none; padding: 0; font: inherit; font-weight: 400; color: var(--muted); text-decoration: underline; cursor: pointer; }
.figwrap.frfig { display: grid; gap: 8px; justify-items: start; }
.frline { font-size: 1.5rem; line-height: 1.9; } .frw { border-bottom: 2px solid transparent; border-radius: 4px; padding: 0 1px; cursor: default; transition: background .15s; }
.frw:hover { background: hsl(var(--h, 230) 70% 50% / .1); } .frw.fused { border-bottom: 2px dotted hsl(var(--h, 230) 45% 50% / .7); } .frw.apart { border: 1.5px solid hsl(var(--h, 230) 45% 50% / .6); padding: 0 5px; }
.frw i { font-style: normal; } .frw i.mute { opacity: .38; } .frw i.graph { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; } .frw i.relic, .frw i.as { text-decoration: underline dotted; text-underline-offset: 4px; } .frw i.snd { font-weight: 700; }
.frplus { margin: 0 .3em; color: var(--muted); font-size: .8em; } .frp:hover { background: hsl(var(--h, 230) 70% 50% / .16); border-radius: 4px; }
.frtie { color: hsl(var(--h, 230) 55% 45%); font-size: .8em; margin: 0 .05em; } .frtie sub { font-size: .7em; } .frnote { min-height: 2.6em; max-width: 60ch; }
.term .ts { display: none; }
body.hints .term { display: inline-grid; justify-items: start; vertical-align: bottom; border-radius: 5px; padding: 0 3px; }
body.hints .term > span { grid-area: 1 / 1; overflow: hidden; white-space: nowrap; transition: max-width .28s ease, opacity .22s ease; }
body.hints .term .tw { max-width: 16em; }
body.hints .term .ts { display: block; opacity: 0; max-width: 0; font-family: var(--math); font-style: italic; font-weight: 600; }
body.hints .term:hover .tw { max-width: 1.5em; opacity: 0; } body.hints .term:hover .ts { max-width: 2em; opacity: 1; }
body.hints .t-intensive { background: color-mix(in srgb, var(--ink) 15%, transparent); box-shadow: inset 0 -2px 0 var(--ink); }
body.hints .t-extensive { background: hsl(268 85% 60% / .2); box-shadow: inset 0 -2px 0 hsl(268 70% 55%); color: hsl(268 60% var(--lr)); }
#hints[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: transparent; }
#hints i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 2px 0 6px; vertical-align: baseline; } #hints .ki { background: color-mix(in srgb, var(--ink) 55%, var(--paper)); } #hints .ke { background: hsl(268 70% 58%); }
.field.slider { width: 100%; min-width: 250px; max-width: 460px; }
.field.slider input[type=range] { width: auto; min-height: 30px; padding: 0; border: 0; background: none; margin: 0 calc(50% / var(--n) - 9px); accent-color: hsl(var(--h, 230) 55% var(--lr)); }
.field.slider.unset input[type=range] { accent-color: var(--muted); opacity: .55; }
.field.slider input[type=range]:focus { box-shadow: none; outline: 2.5px solid hsl(var(--h, 230) 70% 50%); outline-offset: 2px; border-radius: 6px; }
.ticks { display: grid; grid-template-columns: repeat(var(--n), 1fr); font-size: var(--fs-s); color: var(--muted); font-variant-numeric: tabular-nums; }
.ticks span { text-align: center; cursor: pointer; padding: 2px 0; border-radius: 6px; } .ticks span.on { color: var(--ink); font-weight: 700; background: hsl(var(--h, 230) 60% 50% / .14); }
.readout { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; min-height: 1.6em; color: var(--muted); font-size: var(--fs-s); }
.readout b { font-size: 1.15rem; color: var(--ink); } .readout span { color: var(--ink); }
.field.slider.ok .ticks .on { background: hsl(162 60% 45% / .22); } .field.slider.no .ticks .on { background: hsl(40 90% 50% / .25); }
.boxes.wide { grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
.opt { cursor: pointer; flex-wrap: wrap; align-items: center; } .opt.done { cursor: default; }
.opt .otext { flex: 1; min-width: 60%; }
.opt.sel { border-color: hsl(var(--h, 230) 60% 50%); background: hsl(var(--h, 230) 60% 50% / .08); }
.final { display: inline-flex; align-items: center; gap: 10px; margin-left: auto; padding: 4px 6px 4px 4px; border-radius: 10px; background: var(--goldbg); }
.finalbtn { border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 700; background: var(--gold); color: #2a1f00; min-height: 34px; }
.finalbtn:hover { filter: brightness(1.07); }
.auto { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-s); color: var(--muted); cursor: pointer; }
.rank.long { display: block; } .rank.long .slotrow { align-items: stretch; margin-bottom: 8px; } .rank.long .slotlab { min-width: 9.5em; align-self: center; }
.rank.long .slot { flex: 1; min-width: 0; border-radius: 12px; } .rank.long + .answerline { margin-top: 4px; }
.rank.long .slot .chip, .tray .chip.drag { border-radius: 10px; text-align: left; }
.rank.long .slotrow .ans { align-self: center; max-width: 16em; }
.fig.wide { max-width: 440px; }
.ftrack { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; } .flaid { stroke: hsl(212 80% 52%); stroke-width: 6; stroke-linecap: round; }
.farc { fill: none; stroke: hsl(212 80% 52%); stroke-width: 6; stroke-linecap: round; } .fsector { fill: hsl(276 70% 55% / .22); stroke: none; }
.fspoke { stroke: var(--muted); stroke-width: 1.4; } .fmark { fill: hsl(212 80% 52%); stroke: var(--paper); stroke-width: 1.5; }
.flab.big { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; } .flab.ang { fill: hsl(276 55% 50%); } .flab.arc { fill: hsl(212 70% 46%); }
.flab.o2 { fill: hsl(328 55% 48%); } .flab.o1 { fill: hsl(300 45% 48%); } .flab.o0 { fill: hsl(276 55% 50%); }
.faxis { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; } .fvec { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.fcomp { stroke-width: 7; stroke-linecap: round; } .fcomp.h { stroke: hsl(188 75% 42%); } .fcomp.v { stroke: hsl(28 85% 52%); }
.flab.th { fill: hsl(188 75% 36%); } .flab.tv { fill: hsl(28 80% 44%); }
.body .figwrap { margin-top: 12px; }
.fhandle { fill: var(--paper); stroke: var(--ink); stroke-width: 2.5; cursor: grab; } .fhandle.axis { stroke: var(--muted); stroke-dasharray: 3 2; }
.fig.grab { touch-action: none; }
.figwrap.tablefig { display: grid; gap: 8px; justify-items: start; } .figbar { display: flex; flex-wrap: wrap; gap: 8px; } .figbar .seg { flex-wrap: wrap; }
.figsvg { width: 100%; max-width: 470px; } .fig.fig.table { width: 100%; max-width: none; height: auto; display: block; }
.fig.wide.grab { max-width: 520px; }
.tedge { stroke: var(--line); stroke-width: 1.2; } .tplane { fill-opacity: .07; stroke-width: 2.2; stroke-linejoin: round; }
.tlab { font: 600 19px var(--math); } .tlab.sym { font-style: italic; font-size: 22px; } .tlab.unit { font: 600 12.5px var(--font); } .tlab.word { font: 650 12.5px var(--font); } .tlab.word.small { font-size: 10.5px; }
.figkey2 { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-s); font-weight: 600; } .figkey2 i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
code { font: .92em ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: color-mix(in srgb, var(--ink) 8%, transparent); border-radius: 5px; padding: 1px 5px; white-space: nowrap; }
/* Signs of right and not yet, on the controls themselves */
.sign { display: inline-flex; align-items: center; font-size: var(--fs-s); font-weight: 800; border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.sign.ok { color: var(--paper); background: var(--good); } .sign.no { color: #2a1f00; background: var(--gold); }
.field.ok input[type="text"] { border-color: var(--good); box-shadow: 0 0 0 3px hsl(162 65% 42% / .25), 0 0 14px hsl(162 70% 45% / .4); }
.field.no input[type="text"] { border-color: var(--notyet); box-shadow: 0 0 0 3px hsl(40 90% 50% / .25), 0 0 14px hsl(40 95% 50% / .35); }
.opt.right { box-shadow: 0 0 0 3px hsl(162 65% 42% / .22), 0 0 14px hsl(162 70% 45% / .35); } .opt.right .k { background: var(--good); color: var(--paper); border-color: transparent; font-weight: 800; }
.opt.missed { box-shadow: 0 0 0 3px hsl(40 90% 50% / .22); } .opt.missed .k { background: var(--gold); color: #2a1f00; border-color: transparent; font-weight: 800; }
.slot.ok { box-shadow: 0 0 12px hsl(162 70% 45% / .35); } .slot .sign { margin-left: auto; margin-right: 4px; }
.field.chips .sign { align-self: center; } .chip.right { background: hsl(162 60% 45% / .2); }
.q { border-left: 4px solid transparent; padding-left: 12px; margin-left: -16px; transition: border-color .25s ease; }
.q.ok { border-left-color: var(--good); } .q.no { border-left-color: var(--gold); } .q.no.late { border-image: linear-gradient(var(--gold), var(--good)) 1; }
.keys { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.key { border: 1px solid var(--line); background: var(--paper); border-radius: 7px; min-width: 30px; min-height: 30px; padding: 0 6px; font-size: 1rem; }
.key:hover { border-color: hsl(var(--h, 230) 60% 50%); }
/* vowel chart */
.figwrap.vowels { display: grid; gap: 10px; justify-items: stretch; max-width: 520px; }
.vchart { position: relative; height: 330px; margin: 22px 30px 26px; border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); }
.vbox { position: absolute; width: 44px; height: 36px; margin: -18px 0 0 -22px; border-radius: 10px; border: 1.5px solid var(--line); display: grid; place-items: center; --g: 0;
  background: hsl(44 95% 56% / calc(var(--g) * .5)); box-shadow: 0 0 calc(var(--g) * 26px) hsl(44 95% 55% / calc(var(--g) * .9)); }
.vbox b { font-size: 1.1rem; line-height: 1; opacity: calc(.14 + var(--g) * .86); text-shadow: 0 0 calc(var(--g) * 10px) hsl(44 100% 60%); }
.vbox span { position: absolute; bottom: -15px; font-size: .68rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.vdot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--ink); opacity: .55; }
/* signed-in line and teacher view */
.who { font-size: var(--fs-s); color: var(--muted); max-width: 30ch; } .who.in { color: var(--good); font-weight: 600; } .who.off { color: var(--notyet); }
.clsnote { font-size: var(--fs-s); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 0; } .clsnote:empty { display: none; }
#teach { max-width: 900px; margin: 14px auto 0; padding: 14px 16px; background: var(--paper); border-radius: 13px; box-shadow: var(--shadow); display: grid; gap: 12px; }
#teach[hidden] { display: none; }
#teach h2 { margin: 0; font-size: var(--fs-l); } .trow1, .tview, .tmissed { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; } .tmissed:empty { display: none; }
#teach select, #teach input[type="text"], #teach input[type="password"], #teach textarea, .tstud input { font: inherit; color: inherit; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--paper); min-height: 42px; }

// Notation:  {head[:form] term [term] [role term]...}

//   {change velocity(it) by ? in [4 s]}

//   {be force timerate(?variable)}
//   {eq ? duration({change velocity(it) by [12 m/s]})}     "How long does it take for...?"
//   {say.perf 3m recipient=1s}                             a role named outright

//         [ ... ]        a quantity or seed box, passed through untouched
//         "..."          an opaque string

    const out = []
    let i = 0
    const word = () => { let j = i; while (j < s.length && !stop.test(s[j])) j++; const w = s.slice(i, j); i = j; return w }
    while (i < s.length) {
      const c = s[i]
      if (/\s/.test(c)) { i++; continue }
      if (c === '[') {
        let d = 0, j = i
        do { if (s[j] === '[') d++; if (s[j] === ']') d--; j++ } while (d > 0 && j < s.length)
        out.push({ k: 'box', v: s.slice(i, j) }); i = j; continue
      }
      if (c === '"') {
        const j = s.indexOf('"', i + 1)
        if (j < 0) throw Error('unclosed string')
        out.push({ k: 'str', v: s.slice(i + 1, j) }); i = j + 1; continue
      }
      if (c === '?') { i++; out.push({ k: '?', v: word() }); continue }
      if ('{}()=,'.includes(c)) { out.push({ k: c }); i++; continue }
      out.push({ k: 'word', v: word() })
    }
    return out
  }

  const parse = text => {
    const ts = tokenize(text)
    let p = 0
    const peek = () => ts[p] || { k: 'end' }
    const take = k => {
      const t = peek()
      if (k && t.k !== k) throw Error(`expected ${k}, found ${t.k}${t.v ? ' ' + t.v : ''}`)
      p++
      return t
    }
    const value = () => (peek().k === '=' ? (take(), take('box').v) : null)

    const items = () => {
      const xs = []
      take('(')
      while (peek().k !== ')') { xs.push(term()); if (peek().k === ',') take() }
      take(')')
      return xs
    }

    const term = () => {
      const t = take()
      if (t.k === '?') return { t: 'q', restr: t.v || null }
      if (t.k === 'box') return { t: 'box', text: t.v }
      if (t.k === 'str') return { t: 'str', text: t.v }
      if (t.k === '{') { p--; return pred() }
      if (t.k !== 'word') throw Error(`unexpected ${t.k}`)
      if (lex.pro[t.v]) return { t: 'pro', tag: t.v }
      if (t.v === '_') return { t: 'gap' }
      if (t.v === 'and' || t.v === 'or') return { t: 'coord', op: t.v, items: items() }
      const [name, form] = t.v.split(':')
      if (lex.fn[name]) {
        if (form && !lex.fn[name].forms[form]) throw Error(`${name} has no form ${form}`)
        return { t: 'fn', name, form: form || null, args: items() }
      }
      const m = t.v.match(/^(?:(a|the)\.)?(?:([A-Z])\.)?(.+)$/)
      const det = m[1] || null, id = m[2] || null, parts = m[3].split('.'), mods = []
      while (parts.length > 1 && lex.adjs.includes(parts[0])) mods.push(parts.shift()) // the.gravitational.force
      const count = parts[0].startsWith('#'), noun = parts.join('.').replace(/^#/, '') // #mass: the body, not the quantity
      if (!count && lex.qty[noun]) {
        let bearer = null
        if (peek().k === '(') { take(); bearer = term(); take(')') }
        return { t: 'qty', name: noun, det, mods, bearer, value: value() }
      }
      const pl = noun.endsWith('+')
      const ref = { t: 'ref', noun: pl ? noun.slice(0, -1) : noun, def: det === 'the', pl, id, mods, attrs: [], rel: null }
      if (peek().k === '(') {
        take()
        while (peek().k !== ')') {
          if (peek().k === '{') { ref.rel = pred(); continue }
          const q = take('word').v
          if (!lex.qty[q]) throw Error(`unknown quantity: ${q}`)
          ref.attrs.push({ t: 'qty', name: q, mods: [], bearer: null, value: value() })
          if (peek().k === ',') take()
        }
        take(')')
      }
      return ref
    }

    const pred = () => {
      take('{')
      const [hw, form] = take('word').v.split(':')
      const [head, ...flags] = hw.split('.')
      const entry = con[head], L = {}
      flags.forEach(x => {
        if (lex.modals.includes(x)) L.modal = x
        else if (['past', 'perf', 'prog', 'not'].includes(x)) L[x] = true
        else throw Error(`unknown verb layer: ${x}`)
      })
      if (!entry) throw Error(`unknown predicate: ${head}`)
      const node = { t: 'pred', head, form: form || null, L, roles: {}, args: [] }
      const frame = entry.frame, bare = []
      while (peek().k !== '}') {
        const t = peek()
        if (t.k === 'end') throw Error('unclosed brace')
        if (t.k === 'word' && entry.roles.includes(t.v)) { take(); node.args.push({ role: t.v, term: term() }) }
        else if (t.k === 'word' && frame.includes(t.v) && ts[p + 1] && ts[p + 1].k === '=') { take(); take(); node.roles[t.v] = term() }
        else if (bare.length < frame.length) bare.push(term())
        else throw Error(`${head} has no role for ${t.v || t.k}`)
      }
      take('}')
      const open = frame.filter(r => !node.roles[r])
      if (!bare.length && open.length === frame.length) throw Error(`${head} needs a ${frame[0]}`)
      const names = entry.mode === 'patientive' ? open.slice(-bare.length) : open.slice(0, bare.length)
      names.forEach((r, i) => { node.roles[r] = bare[i] })
      return node
    }

    const tree = pred()
    if (peek().k !== 'end') throw Error('text after the closing brace')
    return tree
  }

  // ---------- realize ----------
  // surface mapping: the first role present is the subject, the second the object
  const present = n => con[n.head].frame.filter(r => n.roles[r])
  const core = n => present(n).filter(r => !(lex.pred[n.head].io && r === 'recipient'))
  const sub = n => n.roles[core(n)[0]]
  const ob = n => n.roles[core(n)[1]] || null
  const third = n => (lex.pred[n.head].io ? n.roles.recipient : n.roles[core(n)[2]]) || null

  const cross = (...lists) => lists.reduce((acc, l) => acc.flatMap(a => l.map(x => [...a, x])), [[]])
  const join = (...parts) => parts.filter(Boolean).join(' ')
  const uniq = xs => [...new Set(xs)]

  // ----- agreement -----
  // person and number of a term; everything that is not a pronoun, a plural or an "and" is 3rd singular
  const SG = { p: 3, pl: false }
  const feat = t =>
    t.t === 'pro' ? lex.pro[t.tag]
    : t.t === 'ref' ? { p: 3, pl: t.pl }
    : t.t === 'gap' ? { p: 3, pl: !!t.pl } // a relative clause's gap has its head's number
    : t.t === 'coord' ? { p: t.items.some(x => feat(x).p === 1) ? 1 : 3, pl: t.op === 'and' }
    : t.t === 'qty' ? { p: 3, pl: !!t.bearer && feat(t.bearer).pl && !lex.qty[t.name].between } // "their masses are"
    : SG
  // the one -s suffix of English: plural nouns and 3rd-singular verbs
  const sfx = w => (/(s|x|z|ch|sh|o)$/.test(w) ? w + 'es' : /[^aeiou]y$/.test(w) ? w.slice(0, -1) + 'ies' : w + 's')
  // present finite form of a verb (first word of a multiword verb) for a subject's features
  const conj = (v, f) => {
    const [w, ...rest] = v.split(' '), sg3 = f.p === 3 && !f.pl
    const fin = w === 'be' ? (f.pl || f.p === 2 ? 'are' : f.p === 1 ? 'am' : 'is') : w === 'have' ? (sg3 ? 'has' : 'have') : sg3 ? sfx(w) : w
    return [fin, ...rest].join(' ')
  }

  // ----- the verb group -----
  // one verb in the form its governor asks for: fin, base, pp or ing
  const shape = (v, need, L, f) => {
    const [w, ...rest] = v.split(' '), irr = lex.irr[w] || {}
    const ed = /e$/.test(w) ? w + 'd' : /[^aeiou]y$/.test(w) ? w.slice(0, -1) + 'ied' : w + 'ed'
    const word =
      need === 'base' ? w
      : need === 'pp' ? irr.pp || ed
      : need === 'ing' ? irr.ing || (/[^e]e$/.test(w) ? w.slice(0, -1) : w) + 'ing'
      : !L.past ? conj(w, f)
      : typeof irr.past === 'function' ? irr.past(f) : irr.past || ed
    return [word, ...rest].join(' ')
  }
  // The group is a nest: modal > perfect > progressive > passive > verb. Each layer fixes the form of
  // the one inside it (have -> pp, be -> ing or pp, modal -> base); tense lands on the outermost.
  const group = (v, L, f, passive, pp, need) => {
    const out = []
    const put = (w, next) => { out.push(shape(w, need, L, f)); need = next }
    // a modal under the past layer takes its own past form: could, would, might
    if (L.modal && need === 'fin') { out.push((L.past && { can: 'could', will: 'would', may: 'might' }[L.modal]) || L.modal); need = 'base' }
    if (L.perf) put('have', 'pp')
    if (L.prog) put('be', 'ing')
    if (passive) put('be', 'pp')
    out.push(need === 'pp' && pp ? pp : shape(v, need, L, f))
    return out
  }
  // Linear order is read off the nest: inversion and "not" take the outermost word; a bare verb
  // other than "be" has nothing to offer them, so "do" is supplied.
  const vg = (v, L = {}, f = SG, passive = false, pp = null) => {
    const words = group(v, L, f, passive, pp, 'fin')
    const w = words.length > 1 || v.split(' ')[0] === 'be' ? words : [shape('do', 'fin', L, f), v]
    return {
      decl: L.not ? join(w[0] === 'can' ? 'cannot' : `${w[0]} not`, ...w.slice(1)) : words.join(' '),
      inv: (s, ...rest) => join(w[0], s, L.not && 'not', ...w.slice(1), ...rest),
      inf: join(L.not && 'not', 'to', ...group(v, L, SG, passive, pp, 'base')),
    }
  }

  // a/an before a word or a box. A box's number decides (8, 11, 18, 80...). Seeded boxes use their first value.
  const an = next => {
    const num = next.match(/^\[\s*(?:[^=\]]*=\s*)?~?\s*(\d+)/)
    if (num) return /^(8|11$|18$)/.test(num[1]) ? 'an' : 'a'
    return /^\u0001?[aeiou]/i.test(next) ? 'an' : 'a'
  }
  const det = (ref, next) => (ref.def ? 'the' : ref.pl ? '' : an(next))
  const wh = q => (!q.restr ? 'what' : lex.qty[q.restr] ? `what ${lex.qty[q.restr].n}` : `which ${q.restr}`)
  // the question phrases a queried quantity admits: its own "how" word, then "what <quantity>"
  const whs = (q, e) =>
    !q.restr && e && e.objWh ? [e.objWh]
    : q.restr && lex.qty[q.restr] && lex.qty[q.restr].how ? [lex.qty[q.restr].how, join(lex.qty[q.restr].prep, wh(q))]
    : [wh(q)]

  // ----- referents -----
  // Indexed referents (the.A.planet). ctx lists, per noun, the ids in play and the definite ones.
  let ctx = { all: {}, def: {} }
  const scan = tree => {
    const all = {}, def = {}
    const walk = x => {
      if (!x || typeof x !== 'object') return
      if (x.t === 'ref' && x.id) {
        (all[x.noun] = all[x.noun] || new Set()).add(x.id)
        if (x.def) (def[x.noun] = def[x.noun] || new Set()).add(x.id)
      }
      Object.values(x).forEach(walk)
    }
    walk(tree)
    const sorted = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, [...v].sort()]))
    return { all: sorted(all), def: sorted(def) }
  }
  const NUM = [, , 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten']
  const ORD = ['first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth', 'ninth', 'tenth']

  // c is the case a pronoun takes: 'subj' or 'obj'
  const refNP = (r, c = 'subj') => {
    if (r.t === 'gap') return ['it']
    if (r.t === 'pro') return [lex.pro[r.tag][c]]
    if (r.rel) return cross(refNP({ ...r, rel: null }), relative(swap(r.rel, x => x && x.t === 'gap', { t: 'gap', pl: r.pl }))).map(x => x.join(' '))
    // a definite among several of its kind is told apart by an ordinal; a further indefinite is "another"
    const defs = ctx.def[r.noun] || []
    const ord = r.id && r.def && defs.length > 1 ? ORD[defs.indexOf(r.id)] : ''
    const other = r.id && !r.def && (ctx.all[r.noun] || []).indexOf(r.id) > 0
    const noun = join(ord, ...(r.mods || []), r.pl ? sfx(r.noun) : r.noun)
    const d = next => (other ? 'another' : det(r, next))
    if (!r.attrs.length) return [join(d(noun), noun)]
    const withs = r.attrs.map(a => `${an(lex.qty[a.name].n)} ${lex.qty[a.name].n} of ${a.value}`).join(' and ')
    const out = [join(d(noun), noun, 'with', withs)]
    if (r.attrs.length === 1 && lex.qty[r.attrs[0].name].attributive)
      out.push(join(d(r.attrs[0].value), r.attrs[0].value, noun))
    return out
  }
  // "my N" / "an object's N" / "the N of an object"
  const possessed = (bearer, n) => {
    if (!bearer) return [`the ${n}`]
    if (bearer.t === 'gap') return [`${bearer.pl ? 'their' : 'its'} ${n}`]
    if (bearer.t === 'pro') return [`${lex.pro[bearer.tag].poss} ${n}`]
    if (bearer.t !== 'ref') return [`the ${n} of ${np(bearer, 'obj')[0]}`]
    const short = refNP(bearer).filter(s => !s.includes(' with '))
    return [...short.map(s => `${s}${bearer.pl ? "'" : "'s"} ${n}`), ...refNP(bearer).map(s => `the ${n} of ${s}`)]
  }
  const qtyNP = t => {
    const q = lex.qty[t.name], several = !!t.bearer && feat(t.bearer).pl
    // a quantity of a pair lies between them; otherwise each of several bearers has its own ("their masses")
    if (several && q.between) return [join('the', ...(t.mods || []), q.n, 'between', np(t.bearer, 'obj')[0])]
    const n = join(...(t.mods || []), several ? sfx(q.n) : q.n)
    if (t.bearer) return possessed(t.bearer, n)
    return [t.det === 'a' ? `${an(n)} ${n}` : t.det === 'the' ? `the ${n}` : n]
  }
  // Like referents paired in one coordination collapse: and(planet, planet) -> "two planets";
  // definites that are the first k of more -> "the first two planets".
  const coordNP = (t, c) => {
    const xs = t.items, a = xs[0], k = xs.length
    const alike = t.op === 'and' && NUM[k] && xs.every(x => x.t === 'ref' && x.noun === a.noun && x.def === a.def && !x.pl && !x.attrs.length && !x.rel)
    if (alike) {
      const defs = ctx.def[a.noun] || [], ids = xs.map(x => x.id).filter(Boolean).sort()
      if (a.def && ids.length === k && defs.length > k && ids.every((id, i) => id === defs[i])) return [`the first ${NUM[k]} ${sfx(a.noun)}`]
      if (!a.def || ids.length < k || defs.length === k) return [join(a.def && 'the', NUM[k], sfx(a.noun))]
    }
    // second person, then third, then first: "you and I", "she and I"
    const rank = x => ({ 2: 0, 3: 1, 1: 2 })[feat(x).p]
    const ordered = t.op === 'and' ? xs.map((x, i) => [x, i]).sort((p, q) => rank(p[0]) - rank(q[0]) || p[1] - q[1]).map(p => p[0]) : xs
    return [list(ordered.map(x => np(x, c)[0]), t.op)]
  }

  // forms of a register entry, pinned form first, then the governing verb's preference
  const fnForms = (t, e, style = null) => {
    const entry = lex.fn[t.name]
    const isWh = t.args.some(a => a.t === 'q'), a0 = t.args[0]
    const o = { isWh, bare: a0.t === 'qty' && !a0.bearer && !a0.det }
    const pref = (e && e.comp) || []
    const rank = ([key, f], k) =>
      key === t.form ? -2 : entry.styled && k === style ? -1 : pref.includes(f.cat) ? pref.indexOf(f.cat) : pref.length
    return Object.entries(entry.forms)
      .map((x, k) => [x, k]).sort((a, b) => rank(...a) - rank(...b) || a[1] - b[1])
      .filter(([[, f]]) => !(f.noWh && isWh) && !(f.noCopula && e && e.copula))
      .map(([[, f], k]) => {
        const xs = t.args.map(a => (a.t === 'q' ? wh(a) : a.t === 'fn' ? fnForms(a, null, k)[0].text : np(a, 'obj')[0]))
        return { cat: f.cat, text: f.f(xs, o), gap: f.strand && t.args.length === 1 ? f.f([''], o).trim() : null }
      })
  }

  // \u0001 marks an opaque symbol ("a", "m₁") so the sentence capital leaves it alone
  const np = (t, c = 'subj') =>
    t.t === 'box' ? [t.text]
    : t.t === 'str' ? [t.text.includes(' ') ? t.text : '\u0001' + t.text]
    : t.t === 'q' ? [wh(t)]
    : t.t === 'coord' ? coordNP(t, c)
    : t.t === 'qty' ? qtyNP(t)
    : t.t === 'fn' ? fnForms(t).filter(f => f.cat === 'np').map(f => f.text)
    : t.t === 'pred' ? nominalNP(t, true)
    : refNP(t, c)
  const obj = t => np(t, 'obj')[0]

  // the predication as a noun phrase; withMeasure adds "of M" after the head
  const nominalNP = (node, withMeasure = false) => {
    const e = lex.pred[node.head], th = sub(node)
    if (!e.n) return []
    const m = node.args.find(a => e.roles[a.role].measure && a.term.t !== 'q')
    const tail = join(
      withMeasure && m ? `of ${obj(m.term)}` : '',
      ...node.args.filter(a => !e.roles[a.role].measure && a.term.t !== 'q')
        .map(a => `${e.roles[a.role].n || e.roles[a.role].v} ${obj(a.term)}`))
    const heads = th.t === 'qty' && e.factor
      ? [
          ...possessed(th.bearer, join(e.n, e.factor, ...(th.mods || []), lex.qty[th.name].n)), // factored
          ...(th.bearer ? np(th).map(q => `the ${e.n} ${e.factor} ${q}`) : []), // unfactored
        ]
      : possessed(th, e.n)
    // a measure and an of-possessor compete for "of": keep the possessive heads when there are any
    const clean = withMeasure && m ? heads.filter(h => !h.includes(' of ')) : heads
    return (clean.length ? clean : heads).map(h => join(h, tail))
  }

  // ways to predicate: { on: the term that serves as subject, vp, red: the vp without its "be" }
  const frames = (node, e) => {
    const S = sub(node), Os = ob(node) ? np(ob(node), 'obj') : [''], O = Os[0], L = node.L || {}
    const tail = node.args.map(a => `${e.roles[a.role].v} ${obj(a.term)}`).join(' ')
    const fr = (on, verb, rest, neg) => {
      const LL = neg ? { ...L, not: true } : L
      const plain = verb === 'be' && !LL.past && !LL.perf && !LL.prog && !LL.modal
      return { on, vp: join(vg(verb, LL, feat(on)).decl, rest), red: plain ? join(LL.not && 'not', rest) : null }
    }
    if (!e.rel) return Os.map(o => fr(S, e.v, join(o, tail)))
    // a relation (equality or inequality): its plain verb phrases, then the forms that split bearer from attribute
    const out = cross(e.vps, Os).map(([[verb, rest, neg], o]) => fr(S, verb, join(rest, o, tail), neg))
    // no split when the quantity lies between a pair: the pair is not what is being compared
    if (S.t === 'qty' && S.bearer && !(lex.qty[S.name].between && feat(S.bearer).pl)) {
      const q = lex.qty[S.name], T = ob(node)
      // bearer is compared with bearer: "more massive than the star", not "than the star's mass"
      const O2 = T && T.t === 'qty' && T.name === S.name && T.bearer ? obj(T.bearer) : O
      if (e.respect) out.push(fr(S.bearer, 'be', join(e.respect[0], 'in', q.n, e.respect[1], O2, tail)))
      if (e.cmp && q.adj) out.push(fr(S.bearer, 'be', join(e.cmp(q.adj), O2, tail)))
    }
    return out
  }

  // a relative clause: "whose length equals the radius" / "equal in length to the radius"
  const relative = node => frames(node, lex.pred[node.head]).flatMap(f =>
    f.on.t === 'gap' ? [...(f.red ? [f.red] : []), `that ${f.vp}`]
    : f.on.t === 'qty' && f.on.bearer && f.on.bearer.t === 'gap' ? [`whose ${lex.qty[f.on.name].n} ${f.vp}`]
    : [])

  // non-finite: "for its velocity to change by [12 m/s]", "for him to have seen us"
  const infinitive = node => {
    const e = lex.pred[node.head]
    const tail = node.args.map(a => `${e.roles[a.role].v} ${obj(a.term)}`).join(' ')
    return np(sub(node), 'obj').map(s => join('for', s, vg(e.v, node.L).inf, ob(node) && obj(ob(node)), tail))
  }

  // "eq" over the duration of an event flattens onto a span verb: "it takes [4 s] for ... to ...",
  // "... lasts [4 s]". A bare ? takes its question word from the quantity it is equated with.
  const spanOf = node => {
    const sides = [sub(node), ob(node)]
    const i = sides.findIndex(t => t && t.t === 'qty' && lex.qty[t.name].span && t.bearer && t.bearer.t === 'pred')
    return i < 0 || !sides[1 - i] ? null : { q: lex.qty[sides[i].name], ev: sides[i].bearer, val: sides[1 - i] }
  }
  // Tense is the event's, not the equation's. The infinitive cannot carry it, so it surfaces on the
  // span verb, the outermost finite word. An event with no tense of its own reads as a general
  // truth ("it takes") or as an open case ("it will take").
  const spans = (node, sp) => {
    const own = node.L || {}, ev = sp.ev.L || {}
    const L = { ...own, past: own.past || ev.past, modal: own.modal || ev.modal }
    const Ls = L.past || L.modal ? [L] : [L, { ...L, modal: 'will' }]
    const asks = sp.val.t === 'q', o = asks ? '' : obj(sp.val)
    const inf = infinitive(sp.ev), noms = nominalNP(sp.ev, true)
    const whq = uniq([sp.q.how, `what ${sp.q.n}`].filter(Boolean))
    const flat = Ls.flatMap(l => sp.q.span.flatMap(sv => {
      const g = vg(sv.v, l), infs = sv.extrapose ? inf : []
      return asks
        ? whq.flatMap(w => [...infs.map(i => `${w} ${g.inv('it', i)}?`), ...noms.map(n => `${w} ${g.inv(n)}?`)])
        : [...infs.map(i => `it ${g.decl} ${o} ${i}.`), ...noms.map(n => `${n} ${g.decl} ${o}.`)]
    }))
    if (L.perf || L.prog || L.modal || L.not) return flat
    const be = shape('be', 'fin', L, SG)
    return [...flat, ...noms.map(n => (asks ? `what ${be} the ${sp.q.n} of ${n}?` : `the ${sp.q.n} of ${n} ${be} ${o}.`))]

    faire: { inf: 'faire', pres: ['fais', 'fais', 'fait', 'faisons', 'faites', 'font'], pp: 'fait' },
    pouvoir: { inf: 'pouvoir', pres: ['peux', 'peux', 'peut', 'pouvons', 'pouvez', 'peuvent'], pp: 'pu' },
    devoir: { inf: 'devoir', pres: ['dois', 'dois', 'doit', 'devons', 'devez', 'doivent'], pp: 'dû' },
  },
  // how the shared modal layers come out: "will" is the futur proche
  modal: { will: 'aller', can: 'pouvoir', must: 'devoir' },
}

const french = (fr = frenchLex, con = require('./syntax.js').concepts) => {
  const T = (w, note = '', x = {}) => ({ w, note, ...x })
  // plain words; a leading article is tagged so that it can contract (à + le -> au)
  const W = (str, note = '') => str.split(' ').map(w => T(w, note, /^(le|la|les)$/.test(w) ? { cat: 'det' } : {}))
  const tail = (w, n, x) => ({ i: w.length - n, j: w.length, ...x })
  // the latent final consonant of the little words that always link
  const latentEnd = w => (/^(les|des|un|nous|vous|ils|elles|mes|tes|ses|nos|vos|leurs|mon|ton|son)$/.test(w) ? [tail(w, 1, { latent: true })] : [])
  // a present form: -ent of ils is silent and signals the person; another final s, t, x, z, d is silent and latent
  const finMarks = (w, f) =>
    idx(f) === 5 && /ent$/.test(w) ? [{ i: w.length - 3, j: w.length, paradigm: true }, tail(w, 1, { latent: true })] // -ent is silent as a whole
    : /[stxzd]$/.test(w) ? [tail(w, 1, { paradigm: true, latent: true })]
    : []
  const present = n => con[n.head].frame.filter(r => n.roles[r])
  const verbNamed = inf => Object.values(fr.verb).find(v => v.inf === inf) || fr.helper[inf]
  const vowel = w => /^[aeiouyàâéèêëîïôûh]/i.test(w)
  const M = { p: 3, pl: false, g: 'm' }
  const swap = (x, hit, to) =>
    hit(x) ? to
    : Array.isArray(x) ? x.map(y => swap(y, hit, to))
    : x && typeof x === 'object' ? Object.fromEntries(Object.entries(x).map(([k, v]) => [k, swap(v, hit, to)]))
    : x
  const hasQ = x => JSON.stringify(x).includes('"t":"q"')

  // ----- forms -----
  const qtyOf = t => {
    if (!fr.qty[t.name]) throw Error(`no French quantity for "${t.name}" yet`)
    return fr.qty[t.name]
  }
  const nounOf = r => {
    if (!fr.noun[r.noun]) throw Error(`no French noun for "${r.noun}" yet`)
    return fr.noun[r.noun]
  }
  const feat = t =>
    t.t === 'pro' ? fr.pro[t.tag]
    : t.t === 'ref' ? { p: 3, pl: t.pl, g: nounOf(t).g }
    : t.t === 'gap' ? { p: 3, pl: !!t.pl, g: t.g || 'm' }
    : t.t === 'qty' ? { p: 3, pl: !!t.bearer && feat(t.bearer).pl && !qtyOf(t).between, g: qtyOf(t).g }
    : t.t === 'fn' ? { p: 3, pl: false, g: fnForms(t)[0].g }
    : t.t === 'pred' && fr.verb[t.head] && fr.verb[t.head].n ? { p: 3, pl: false, g: fr.verb[t.head].n.g }
    : t.t === 'coord' ? { p: 3, pl: t.op === 'and', g: t.items.every(x => feat(x).g === 'f') ? 'f' : 'm' }
    : M
  const idx = f => (f.pl ? 3 : 0) + f.p - 1
  const who = f => ['je', 'tu', 'il/elle', 'nous', 'vous', 'ils/elles'][idx(f)]
  const gender = (g, pl) => `${g === 'f' ? 'feminine' : 'masculine'}${pl ? ' plural' : ''}`
  const pres = (v, f) => (v.pres || ['e', 'es', 'e', 'ons', 'ez', 'ent'].map(x => v.inf.slice(0, -2) + x))[idx(f)]
  // imparfait: the stem of the nous form (ét- for être) with -ais, -ais, -ait, -ions, -iez, -aient
  const impf = (v, f) => (v.inf === 'être' ? 'ét' : pres(v, { p: 1, pl: true }).replace(/ons$/, '')) + ['ais', 'ais', 'ait', 'ions', 'iez', 'aient'][idx(f)]
  const part = v => v.pp || v.inf.slice(0, -2) + 'é'
  // agreement letters, with their marks: e and s are silent, but e makes a final s or t before it sound
  const agree = (w, g, pl) => {
    const fem = w + (g === 'f' ? 'e' : ''), out = fem + (pl && !/s$/.test(fem) ? 's' : ''), marks = []
    if (g === 'f' && /[st]$/.test(w)) marks.push({ i: w.length - 1, j: w.length, sounded: true })
    if (g === 'f') marks.push({ i: w.length, j: w.length + 1, paradigm: true })
    if (out.length > fem.length) marks.push(tail(out, 1, { paradigm: true }))
    return { w: out, marks }
  }
  const agreed = (base, g, pl, note, lemma) => { const a = agree(base, g, pl); return T(a.w, note, { lemma, marks: a.marks }) }
  const plural = w => (/[sxz]$/.test(w) ? w : /eau$/.test(w) ? w + 'x' : w + 's')
  // an adjective in the form its noun asks for
  const adjTok = (name, f) => {
    const a = fr.adj[name] || {}
    const fem = a.f || (/e$/.test(name) ? name : name + 'e')
    const w = f.g === 'f' ? (f.pl ? plural(fem) : fem) : f.pl ? a.mp || plural(name) : name
    return T(w, `adjective, ${gender(f.g, f.pl)} to agree`, { lemma: name, marks: w !== name && w.startsWith(name) ? [{ i: name.length, j: w.length, paradigm: true }] : [] })
  }

  // ----- noun phrases -----
  const detTok = (def, g, pl) => {
    const d = def ? (pl ? 'les' : g === 'f' ? 'la' : 'le') : pl ? 'des' : g === 'f' ? 'une' : 'un'
    return T(d, `${def ? 'definite' : 'indefinite'} article, ${gender(g, pl)}`, { cat: 'det', marks: latentEnd(d) })
  }
  // a noun, possibly of several words (quantité de mouvement): only the first inflects
  const nounTok = (n, pl, mods = []) => {
    const [first, ...more] = n.n.split(' '), w = pl ? plural(first) : first
    return [
      T(w, `noun, ${gender(n.g, pl)}`, { lemma: first, marks: w !== first ? [tail(w, 1, { paradigm: true, latent: true })] : [] }),
      ...more.map(x => T(x, 'part of the noun')),
      ...mods.map(m => adjTok(fr.mod[m], { g: n.g, pl })), // the adjective follows its noun
    ]
  }
  // indexed referents (the.A.planet): per noun, the ids in play and the definite ones
  let ctx = { all: {}, def: {} }
  const scan = tree => {
    const all = {}, def = {}
    const walk = x => {
      if (!x || typeof x !== 'object') return
      if (x.t === 'ref' && x.id) {
        (all[x.noun] = all[x.noun] || new Set()).add(x.id)
        if (x.def) (def[x.noun] = def[x.noun] || new Set()).add(x.id)
      }
      Object.values(x).forEach(walk)
    }
    walk(tree)
    const sorted = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, [...v].sort()]))
    return { all: sorted(all), def: sorted(def) }
  }
  const DE = () => T('de', 'de: of')
  const possTok = (tag, n, pl) => {
    const [m, f, p] = fr.poss[tag], early = n.g === 'f' && !pl && vowel(n.n)
    const w = pl ? p : n.g === 'f' && !early ? f : m
    return T(w, `possessive determiner${early ? '; the masculine form stands before a vowel' : ''}`, { cat: 'det', marks: latentEnd(w) })
  }
  const quel = f => T('quel' + (f.g === 'f' ? 'le' : '') + (f.pl ? 's' : ''), `question determiner, ${gender(f.g, f.pl)} to agree with its noun`)
  // a question phrase and its features: "combien", or "quel angle"
  const whOf = q => {
    if (!q.restr) return { toks: [T('combien', 'question word for an amount')], f: M }
    const n = fr.qty[q.restr] || fr.noun[q.restr]
    if (!n) throw Error(`no French noun for "${q.restr}" yet`)
    const f = { p: 3, pl: false, g: n.g }
    return { toks: [quel(f), ...nounTok(n, false)], f }
  }

  const refNPs = r => {
    const n = nounOf(r), f = { p: 3, pl: r.pl, g: n.g }
    // a definite among several of its kind takes an ordinal; a further indefinite is "un autre"
    const defs = ctx.def[r.noun] || [], k = r.id && r.def && defs.length > 1 ? defs.indexOf(r.id) : -1
    const other = r.id && !r.def && (ctx.all[r.noun] || []).indexOf(r.id) > 0
    const head = [
      detTok(r.def, n.g, r.pl),
      ...(other ? [T('autre' + (r.pl ? 's' : ''), 'a further one of the same kind')] : []),
      ...(k === 0 ? [adjTok('premier', f)] : k > 0 ? [T(fr.ord[k], 'ordinal')] : []),
      ...nounTok(n, r.pl, r.mods),
    ]
    let outs = [head]
    if (r.attrs.length) {
      // "un objet de masse [5 kg]"; a mass or a length can also stand alone: "un objet de [5 kg]"
      const full = r.attrs.flatMap((a, i) => [...(i ? [T('et', 'and')] : []), DE(), ...nounTok(qtyOf(a), false), T(a.value, 'given quantity', { cat: 'given' })])
      outs = [[...head, ...full]]
      if (r.attrs.length === 1 && qtyOf(r.attrs[0]).attributive) outs.push([...head, DE(), T(r.attrs[0].value, 'given quantity', { cat: 'given' })])
    }
    if (r.rel) outs = outs.flatMap(h => relatives(r.rel, { p: 3, pl: r.pl, g: n.g }).map(rel => [...h, ...rel]))
    return outs
  }
  const qtyNPs = t => {
    const q = qtyOf(t), several = !!t.bearer && feat(t.bearer).pl
    // a quantity of a pair lies between them; otherwise each of several bearers has its own ("leurs masses")
    if (several && q.between) return nps(t.bearer).map(b => [detTok(true, q.g, false), ...nounTok(q, false, t.mods), T('entre', 'between'), ...b])
    const noun = nounTok(q, several, t.mods)
    // a quantity named in general takes the definite article: "la force"
    if (!t.bearer) return [[detTok(t.det !== 'a', q.g, false), ...noun]]
    if (t.bearer.t === 'pro') return [[possTok(t.bearer.tag, q, several), ...noun]]
    if (t.bearer.t === 'gap') return [[detTok(true, q.g, several), ...noun]] // after dont
    return nps(t.bearer).map(b => [detTok(true, q.g, several), ...noun, DE(), ...b])
  }
  const sep = (argv, word) => argv.flatMap((a, i) => [...(i ? [T(word)] : []), ...a])
  // after "de", a conjunct that begins with an article takes its own de: "de G et du rapport"
  const listToks = (argv, conj, de = false) => argv.flatMap((a, i) => [...(i ? [i === argv.length - 1 ? T(conj) : T(',', '', { join: true })] : []), ...(i && de && a[0] && a[0].cat === 'det' ? [DE()] : []), ...a])
  // forms of a register entry or operator; a nested operator follows the style of the one above it
  const fnForms = (t, style = null) => {
    const entry = fr.fn[t.name]
    if (!entry) throw Error(`no French entry for "${t.name}" yet`)
    const rank = ([k, i]) => (k === t.form ? -2 : entry.styled && i === style ? -1 : 0)
    return Object.keys(entry.forms).map((k, i) => [k, i]).sort((a, b) => rank(a) - rank(b) || a[1] - b[1]).map(([k, i]) => {
      const form = entry.forms[k]
      const build = argv => form.f.flatMap(x =>
        typeof x === 'number' ? argv[x] : x === 'LIST' ? listToks(argv, 'et', true) : x === 'PLUS' ? sep(argv, 'plus') : x === 'FOIS' ? sep(argv, 'fois') : W(x))
      const args = t.args.map(a => (a.t === 'q' ? whOf(a).toks : a.t === 'fn' ? fnForms(a, i)[0].toks : np(a)))
      return { toks: build(args), g: form.g, gap: form.strand && t.args.length === 1 ? build([[]]).slice(0, -1) : null }
    })
  }
  // every way of saying a term as a noun phrase
  const nps = t => {
    if (t.t === 'box') return [[T(t.text, 'given quantity', { cat: 'given' })]]
    if (t.t === 'str') return [[T(t.text, 'given as written', { cat: 'given' })]]
    if (t.t === 'pro') return [[T(fr.pro[t.tag].dis, 'stressed pronoun')]]
    if (t.t === 'q') return [whOf(t).toks]
    if (t.t === 'ref') return refNPs(t)
    if (t.t === 'qty') return qtyNPs(t)
    if (t.t === 'fn') return fnForms(t).map(x => x.toks)
    if (t.t === 'coord') return [coordNP(t)]
    if (t.t === 'pred') return nominalNPs(t, true)
    throw Error('this kind of term is not in the French realizer yet')
  }
  const np = t => nps(t)[0]
  // like referents paired in one coordination collapse: "deux planètes", "les deux premières planètes"
  const coordNP = t => {
    const xs = t.items, a = xs[0], k = xs.length
    const alike = t.op === 'and' && fr.num[k] && xs.every(x => x.t === 'ref' && x.noun === a.noun && x.def === a.def && !x.pl && !x.attrs.length && !x.rel)
    if (alike) {
      const n = nounOf(a), defs = ctx.def[a.noun] || [], ids = xs.map(x => x.id).filter(Boolean).sort()
      const num = T(fr.num[k], 'number'), nouns = nounTok(n, true, a.mods)
      if (a.def && ids.length === k && defs.length > k && ids.every((id, i) => id === defs[i])) return [detTok(true, n.g, true), num, adjTok('premier', { g: n.g, pl: true }), ...nouns]
      if (!a.def || ids.length < k || defs.length === k) return [...(a.def ? [detTok(true, n.g, true)] : []), num, ...nouns]
    }
    return listToks(xs.map(np), t.op === 'and' ? 'et' : 'ou')
  }

  const roleToks = (node, v, skip = null, nominal = false) =>
    node.args.filter(a => a !== skip && a.term.t !== 'q').flatMap(a => {
      const r = v.roles && v.roles[a.role]
      if (!r) throw Error(`the role "${a.role}" of ${node.head} is not in the French realizer yet`)
      return [T((nominal && r.n) || r.v, 'preposition'), ...np(a.term)]
    })
  // the event as a noun phrase: "sa variation de vitesse", "la variation de sa vitesse"
  const nominalNPs = (node, withMeasure = false) => {
    const v = fr.verb[node.head]
    if (!v || !v.n) return []
    const th = node.roles[present(node)[0]], N = nounTok(v.n, false)
    const m = node.args.find(a => v.roles[a.role] && v.roles[a.role].measure && a.term.t !== 'q')
    const rest = [...(withMeasure && m ? [DE(), ...np(m.term)] : []), ...roleToks(node, v, m, true)]
    const owned = (who, noun, n) =>
      !who ? [[detTok(true, n.g, false), ...noun]]
      : who.t === 'pro' ? [[possTok(who.tag, n, false), ...noun]]
      : nps(who).map(b => [detTok(true, n.g, false), ...noun, DE(), ...b])
    const heads = th.t === 'qty' && v.factor
      ? [
          ...owned(th.bearer, [...N, T(v.factor, 'de: in respect of'), ...nounTok(qtyOf(th), false, th.mods)], v.n), // bearer split from attribute
          ...(th.bearer ? qtyNPs(th).map(q => [detTok(true, v.n.g, false), ...N, DE(), ...q]) : []),
        ]
      : owned(th, N, v.n)
    return heads.map(h => [...h, ...rest])
  }

  // ----- the verb nest: modal > compound past > verb -----
  // cl: clitics; pp: how the participle is made; tailV: an infinitive the verb governs (faire fondre)
  const nest = (v, f, L, { cl = [], pp = null, tailV = [], etre = false } = {}) => {
    if (L.modal && !fr.modal[L.modal]) throw Error(`the layer "${L.modal}" is not in the French realizer yet`)
    // The shared "past" layer is the passé composé for an event and the imparfait for a state, for
    // something in progress, and for a modal ("pouvait", "allait").
    const ongoing = L.past && !L.perf && !L.modal && (L.prog || v.inf === 'être' || v.inf === 'avoir')
    const compound = L.perf || (L.past && !L.modal && !ongoing), aux = verbNamed(etre ? 'être' : 'avoir')
    const ppTok = pp || (() => (etre
      ? agreed(part(v), f.g, f.pl, `past participle of ${v.inf}; with être it agrees with the subject`, v.inf)
      : T(part(v), `past participle of ${v.inf}`, { lemma: v.inf })))
    // the non-finite core: "le voir" / "l'avoir vu"
    const core = compound
      ? [...cl, T(aux.inf, `infinitive of the auxiliary ${aux.inf}`, { lemma: aux.inf }), ppTok(), ...tailV]
      : [...cl, T(v.inf, `infinitive of ${v.inf}`, { lemma: v.inf }), ...tailV]
    if (L.modal) {
      const m = verbNamed(fr.modal[L.modal]), w = L.past ? impf(m, f) : pres(m, f)
      const fin = T(w, `${m.inf}, ${L.past ? 'imparfait' : 'present'}, ${who(f)}${L.modal === 'will' && !L.past ? ' (futur proche)' : ''}`, { cat: 'fin', lemma: m.inf, marks: finMarks(w, f) })
      return { fin, pre: [], post: core, core }
    }
    if (compound) {
      const w = pres(aux, f)
      const fin = T(w, `${aux.inf}, present, ${who(f)}: auxiliary of the passé composé`, { cat: 'fin', lemma: aux.inf, marks: finMarks(w, f) })
      return { fin, pre: cl, post: [ppTok(), ...tailV], core }
    }
    const w = ongoing ? impf(v, f) : pres(v, f)
    const fin = T(w, `${v.inf}, ${ongoing ? 'imparfait' : 'present'}, ${who(f)}`, { cat: 'fin', lemma: v.inf, marks: finMarks(w, f) })
    return { fin, pre: cl, post: tailV, core }
  }

  // ----- a clause built on one of the lexicon's verbs -----
  const pieces = (node, how = 'direct', objToks = null) => {
    const v = fr.verb[node.head], L = node.L || {}
    if (!v) throw Error(`no French verb for "${node.head}" yet`)
    const [sRole, ...others] = present(node)
    const S = node.roles[sRole], f = S.t === 'q' ? M : feat(S)

    // objects: pronouns become clitics, nouns follow the verb, a queried object is left to the question
    let clitics = [], after = [], asked = null
    others.forEach(r => {
      const t = node.roles[r], io = r === 'recipient'
      if (t.t === 'q') asked = r
      else if (t.t === 'pro') clitics.push({ pro: fr.pro[t.tag], io })
      else after.push(...(io ? [T('à', 'marks the indirect object')] : []), ...(objToks && !io ? objToks : np(t)))
    })
    // me/te/nous/vous as direct object cannot sit beside an indirect clitic: the indirect one steps out
    const d = clitics.find(c => !c.io), i = clitics.find(c => c.io)
    if (d && i && d.pro.p < 3) {
      clitics = [d]
      after.push(T('à', 'marks the indirect object'), T(i.pro.dis, 'stressed pronoun: an indirect clitic cannot follow me/te/nous/vous'))
    }
    const askedArg = node.args.find(a => a.term.t === 'q') || null
    after.push(...roleToks(node, v, askedArg))
    // Unit 5: with no agent, a patientive verb has its patient as subject. The 'se' class marks
    // this with the reflexive pronoun; the labile class leaves it unmarked.
    const patientive = con[node.head].mode === 'patientive' && !node.roles.agent
    const refl = patientive && v.class === 'se'
    // the transitive of a labile verb may go through faire: the subject causes, the infinitive names what happens
    const faire = how === 'faire' ? fr.helper.faire : null
    // clitic order: me/te/se/nous/vous, then le/la/les, then lui/leur
    const rank = c => (c.pro.p < 3 ? 0 : c.io ? 2 : 1)
    const seTok = refl ? [T(S.t === 'pro' ? fr.pro[S.tag].refl : 'se', 'reflexive pronoun: marks that the subject is what undergoes the action', { cat: 'clitic', role: 'patientive marker' })] : []
    const cl = [...seTok, ...clitics.sort((a, b) => rank(a) - rank(b))
      .map(c => { const w = c.io ? c.pro.io : c.pro.do; return T(w, `${c.io ? 'indirect' : 'direct'} object pronoun, placed before the verb`, { cat: 'clitic', role: c.io ? 'indirect object' : 'direct object', marks: latentEnd(w) }) })]
    const caused = faire ? [T(v.inf, `infinitive of ${v.inf}: what the subject causes to happen`, { lemma: v.inf })] : []
    // a direct object standing before the participle makes it agree: a clitic, or a fronted question phrase
    const front = asked && asked !== 'recipient' && node.roles[asked].restr ? whOf(node.roles[asked]).f : null
    const pp = () => {
      const base = part(v)
      if (faire) return T('fait', 'past participle of faire; before an infinitive it does not agree', { lemma: 'faire' })
      if (refl) return agreed(base, f.g, f.pl, `past participle of ${v.inf}; a reflexive verb takes être and agrees with the subject`, v.inf)
      if (v.aux === 'être') return agreed(base, f.g, f.pl, `past participle of ${v.inf}; with être it agrees with the subject`, v.inf)
      if (d) return agreed(base, d.pro.g, d.pro.pl, `past participle of ${v.inf}; agrees with the direct object "${d.pro.do}" placed before it${d.pro.g ? '' : ' (masculine by default)'}`, v.inf)
      if (front) return agreed(base, front.g, front.pl, `past participle of ${v.inf}; agrees with the direct object asked about, which stands before it`, v.inf)
      return T(base, `past participle of ${v.inf}`, { lemma: v.inf })
    }
    const n = nest(faire || v, f, L, { cl, pp, tailV: caused, etre: refl || v.aux === 'être' })
    return { ...n, S, f, L, v, after, asked, askedArg }
  }

  const NE = () => T('ne', 'first half of the negation')
  const PAS = () => T('pas', 'second half of the negation, after the conjugated verb', { marks: [tail('pas', 1, { latent: true })] })
  const subjAlts = S => (S.t === 'pro' ? [[T(fr.pro[S.tag].subj, 'subject pronoun', { cat: 'clitic', role: 'subject', marks: latentEnd(fr.pro[S.tag].subj) })]] : nps(S))
  const stmt = (p, subj) => [...subj, ...(p.L.not ? [NE()] : []), ...p.pre, p.fin, ...(p.L.not ? [PAS()] : []), ...p.post, ...p.after]
  // Inversion: a pronoun subject goes after the verb; a noun subject stays and a pronoun echoes it there.
  // -t- has no word behind it: it writes the liaison consonant that the verb form has no letter for.
  const inverted = (p, S, subj, wh) => {
    const isPro = S && S.t === 'pro'
