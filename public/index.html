      e.card.focus({ preventScroll: true }); window.scrollTo(0, 0); save();
    };

    // ----- the self-check side: a plain list of problems, each answered on its own -----
    const BATCH = 5;
    const mountFace = e => {
      const n = e.n; let queue = [], shown = 0; const tally = [];
      const head = $('div', 'facehead'), dots = $('span', 'dots'), count = $('span', 'quiet'), list = $('div', 'qlist'), foot = $('div', 'facefoot');
      const fresh = btn('linkbtn', 'New set');
      const rusty = $('details', 'rusty', '<summary>I’m rusty with this</summary>'), rbox = $('div', 'rustbox');
      rbox.append($('span', 'quiet', 'Ask for more practice ' + (isLeaf(n) ? 'here' : 'across this whole branch') + ' before it counts as mastered again:'));
      [['A little', 1, 'one more right answer on each problem'], ['A lot', 2, 'earn each problem again from the start'], ['Start over', 'reset', 'forget my attempts here']].forEach(([label, amt, tip]) => {
        const b = btn('chip', label + ' <span class="quiet">' + tip + '</span>');
        b.onclick = () => { if (amt === 'reset' && !b.dataset.armed) { b.dataset.armed = 1; b.innerHTML = 'Press again to forget my attempts here'; setTimeout(() => { delete b.dataset.armed; b.innerHTML = label + ' <span class="quiet">' + tip + '</span>'; }, 4000); return; } refresh(progress.rust(n.id, amt)); save(); rusty.open = false; deal(); };
        rbox.append(b);
      });
      rusty.append(rbox);
      head.append(dots, count, rusty, fresh); e.face.replaceChildren(head, list, foot);
      const paintTally = () => {
        dots.innerHTML = tally.map(t => '<i class="d ' + (t.ok == null ? '' : t.ok ? 'ok' : 'no') + '"></i>').join('');
        const ok = tally.filter(t => t.ok).length, no = tally.filter(t => t.ok === false).length;
        count.textContent = ok + no ? ok + ' mastered' + (no ? ', ' + no + ' not yet' : '') : (isLeaf(n) ? '' : 'Problems drawn from across this branch');
      };
      const more = btn('btn', 'More problems');
      const paintFoot = () => { foot.replaceChildren(); if (shown < queue.length) { more.innerHTML = 'More problems <span class="quiet">' + (queue.length - shown) + ' left</span>'; foot.append(more); } };
      const addBlock = (item, slot, forceFresh) => {
        const t = slot ? slot.t : { ok: null }; if (!slot) tally.push(t); else t.ok = null;
        const block = slot ? slot.block : $('div', 'q'); block.replaceChildren(); block.className = 'q';
        const inst = Core.instantiate(item, forceFresh || progress.stat(item.id).n > 0);
        const where = $('div', 'qhead', '<span class="where">' + (item.node === n ? '' : esc(item.node.title)) + '</span>');
        const after = $('div', 'after');
        let settled = false, lastOk = null;
        const finishItem = () => {
          if (settled) return; settled = true;
          if (inst.why) after.append($('p', 'why', rich(inst.why)));
          const tools = $('div', 'qtools');
          if (lastOk === false && item.node.bite) tools.append($('details', 'seebite', '<summary>See the exposition</summary>' + biteHtml(item.node)));
          if (Core.rerollable(item)) { const again = btn('linkbtn', /\||\.\./.test(item.seedLines.join('') + item.prompt) || item.kind === 'ladder' ? 'New numbers' : 'Reword question'); again.onclick = () => { addBlock(item, { t, block }, true).focus(); paintTally(); }; tools.append(again); }
          if (tools.childNodes.length) after.append(tools);
          const nextBlock = block.nextElementSibling;
          const target = nextBlock && nextBlock.querySelector('.item > .answerline input[type="text"]:not([disabled]), .boxes input[type="text"]:not([disabled]), .ladder input:not([disabled])');
          if (target) setTimeout(() => target.focus({ preventScroll: true }), 0);
        };
        const r = (renderers[inst.kind] || renderers.reveal)(inst, res => {
          if (res.resolved) { if (res.ok) { after.replaceChildren($('div', 'verdict ok', 'There it is')); block.classList.add('late'); } finishItem(); return; }
          const touched = new Set();
          (res.credits || []).forEach(c => progress.attempt(c.item, c.node, c.ok, c.answer).forEach(x => touched.add(x)));
          progress.attempt(item.id, item.node.id, res.ok, res.answer).forEach(x => touched.add(x));
          lastOk = res.ok; t.ok = res.ok; save(); paintTally(); refresh([...touched]); block.classList.add(res.ok ? 'ok' : 'no');
          after.replaceChildren($('div', 'verdict ' + (res.ok ? 'ok' : 'no'), res.ok ? WORD.ok : WORD.no));
          if (!res.open) finishItem();
        });
        block.append(where, r.el, after);
        if (!slot) list.append(block);
        return r;
      };
      const showMore = k => { const first = shown; for (; shown < Math.min(queue.length, first + k); shown++) addBlock(queue[shown]); paintFoot(); paintTally(); };
      const deal = () => { queue = Core.pool(n, progress); shown = 0; tally.length = 0; list.replaceChildren(); showMore(isLeaf(n) ? queue.length : BATCH); };
      more.onclick = () => { const at = list.children.length; showMore(BATCH); const b = list.children[at]; if (b) b.scrollIntoView({ block: 'nearest' }); };
      fresh.onclick = deal;
      deal();
    };

    // ----- flagged list -----
    const flagBtn = document.getElementById('flagged'), flagList = document.getElementById('flaglist');
    const paintFlags = () => {
      const ids = Object.keys(progress.flags).filter(id => course.nodes[id]);
      flagBtn.textContent = 'Flagged ' + ids.length; flagBtn.disabled = !ids.length;
      flagList.replaceChildren(...ids.map(id => { const b = btn('chip link', esc(course.nodes[id].title)); b.style.setProperty('--h', course.nodes[id].hue); b.onclick = () => { flagList.hidden = true; focusOn(id); }; return b; }));
      if (!ids.length) flagList.hidden = true;
    };
    flagBtn.onclick = () => { flagList.hidden = !flagList.hidden; };
    // ----- units that open into words -----
    // An opened unit is ordinary inline text inside its box, so the line is laid out again around it. The box may
    // break across lines like any run of words (box-decoration-break), and the part cut at the right margin goes on.
    // The pointer counts as still on the unit while it is inside the box as it was when closed or as it is now, so
    // the reflow can never take the unit out from under the pointer and close it.
    const canHover = typeof matchMedia === 'function' && matchMedia('(hover: hover)').matches;
    const calm = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    let openU = null, zone = null, shutU = null, typer = 0;
    const wordsOf = x => x.dataset.w.split('|');
    const put = (x, text) => x.querySelector('.ut').replaceChildren(...text.split(' ').flatMap((w, i) => { const sp = $('span', 'wd'); sp.textContent = w; return i ? [' ', sp] : [sp]; }));
    const typeIn = (x, text) => { clearInterval(typer); if (calm) return put(x, text); let n = 1; put(x, text.slice(0, n)); typer = setInterval(() => { n = Math.min(text.length, n + 2); put(x, text.slice(0, n)); if (n >= text.length) clearInterval(typer); }, 16); };
    const closeUnit = () => { if (!openU) return; clearInterval(typer); openU.classList.remove('open'); openU.closest('.given').classList.remove('gopen'); put(openU, ''); openU._busy = false; openU = null; };
    const openUnit = x => { closeUnit(); const g = x.closest('.given'); zone = g.getBoundingClientRect(); openU = x; g.classList.add('gopen'); x.classList.add('open'); const w = wordsOf(x); typeIn(x, w[(+x.dataset.k || 0) % w.length]); };
    const within = (r, ev, pad) => ev.clientX >= r.left - pad && ev.clientX <= r.right + pad && ev.clientY >= r.top - pad && ev.clientY <= r.bottom + pad;
    const onUnit = ev => !!openU && (within(zone, ev, 2) || [...openU.closest('.given').getClientRects()].some(r => within(r, ev, 2)));
    const swap = (x, k, dir) => {
      const w = wordsOf(x); x.dataset.k = k; clearInterval(typer);
      const wd = [...x.querySelectorAll('.wd')]; if (calm || !wd.length || !wd[0].animate) return put(x, w[k]);
      x._busy = true;
      wd.forEach(e => e.animate([{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(' + -dir * 85 + '%)', opacity: 0 }], { duration: 120, easing: 'ease-in', fill: 'forwards' }));
      setTimeout(() => { if (openU !== x) return; put(x, w[k]); x.querySelectorAll('.wd').forEach(e => e.animate([{ transform: 'translateY(' + dir * 85 + '%)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }], { duration: 160, easing: 'ease-out' })); setTimeout(() => { x._busy = false; }, 160); }, 120);
    };
    treeEl.onmouseover = ev => { if (!canHover) return; const g = ev.target.closest('.given'), x = g && g.querySelector('.u'); if (x && x !== openU && x !== shutU && !(openU && onUnit(ev))) openUnit(x); };
    document.addEventListener('mousemove', ev => { if (!canHover) return; if (openU && !onUnit(ev)) closeUnit(); if (shutU && !within(zone, ev, 2)) shutU = null; });
    document.addEventListener('scroll', () => { closeUnit(); shutU = null; }, true);
    // A click steps through the wordings and then back to the symbol.
    treeEl.onclick = ev => {
      const x = openU && onUnit(ev) ? openU : ev.target.closest('.u'); if (!x) return;
      if (x !== openU) { if (!canHover) { x.dataset.k = 0; openUnit(x); } return; }
      const n = wordsOf(x).length, k = (+x.dataset.k || 0) + 1;
      if (k >= n) { x.dataset.k = 0; closeUnit(); if (canHover) shutU = x; } else swap(x, k, 1);
    };
    // The wheel rolls through the wordings while the pointer is on the unit.
    treeEl.addEventListener('wheel', ev => {
      const x = openU; if (!x || !onUnit(ev)) return; const n = wordsOf(x).length; if (n < 2) return;
      ev.preventDefault(); x._acc = (x._acc || 0) + ev.deltaY; if (Math.abs(x._acc) < 24 || x._busy) return;
      const dir = x._acc > 0 ? 1 : -1; x._acc = 0; swap(x, ((+x.dataset.k || 0) + dir + n) % n, dir);
    }, { passive: false });

    // ----- keyboard -----
    document.onkeydown = ev => {
      if (ev.target.closest('input, textarea, .face') || ev.metaKey || ev.ctrlKey || ev.altKey) return;
      const cards = [...treeEl.querySelectorAll('.card')].filter(c => c.offsetParent !== null);
      const i = cards.indexOf(document.activeElement), card = cards[i];
      const n = card && course.nodes[card.parentNode.dataset.id];
      const move = d => { const t = cards[Math.max(0, Math.min(cards.length - 1, (i < 0 ? 0 : i + d)))]; if (t) { t.focus(); ev.preventDefault(); } };
      if (ev.key === 'ArrowDown') move(1);
      else if (ev.key === 'ArrowUp') move(-1);
      else if (!n) return;
      else if (ev.key === 'Enter' || ev.key === ' ') { toggle(n); ev.preventDefault(); }
      else if (ev.key === 'ArrowRight') { if (!els[n.id].root.classList.contains('open')) setOpen(n, true); else move(1); }
      else if (ev.key === 'ArrowLeft') { if (els[n.id].root.classList.contains('open') && n.id !== ui.focus) setOpen(n, false); else if (n.parent && els[n.parent.id] && n.id !== ui.focus) els[n.parent.id].card.focus(); }
      else if (ev.key.toLowerCase() === 's') { if (!els[n.id].bc.disabled) { setMode(n, 'check'); setOpen(n, true); } }
      else if (ev.key.toLowerCase() === 'e') { setMode(n, 'expo'); setOpen(n, true); }
      else if (ev.key.toLowerCase() === 'f') focusOn(n.id);
      else if (ev.key === 'Escape') { const f = course.nodes[ui.focus]; if (f.parent) focusOn(f.parent.id); }
    };

    // ----- first paint -----
    document.getElementById('coursename').textContent = course.root.level < 0 ? 'Curriculum Tree' : course.root.title;
    document.title = 'Curriculum Tree';
    const openAll = n => { if (ui.open[n.id]) { setOpen(n, true); if (els[n.id].root.dataset.mode === 'expo') n.children.forEach(openAll); } };
    build(course.root); setOpen(course.root, true); course.root.children.forEach(openAll);
    focusOn(ui.focus); paintFlags();
    const foot = document.getElementById('lint');
    foot.textContent = course.order.length + ' nodes, ' + course.order.reduce((a, n) => a + n.items.length, 0) + ' items' + (course.warn.length ? ', ' + course.warn.length + ' warnings in the course files (see console)' : '') + (ctx.name ? ' · ' + ctx.name : '');
    course.warn.forEach(w => console.warn('[course]', w));
    document.getElementById('reset').onclick = function () {
      if (this.dataset.armed) { store.save({}); location.reload(); return; }
      this.dataset.armed = 1; this.textContent = 'Press again to erase all progress on this device';
      setTimeout(() => { delete this.dataset.armed; this.textContent = 'Reset my progress'; }, 4000);
    };

    // ----- teacher view: the roster, personal links, and the class shown on this same tree -----
    if (ctx.teach) {
      const box = document.getElementById('teach'); box.hidden = false;
      let key = ''; try { key = localStorage.getItem('ctree.teacherKey') || ''; } catch (e) { /* none */ }
      const T = (p, body) => api(p, { method: body ? 'POST' : 'GET', headers: { 'x-teacher-key': key, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
      const link = s => location.origin + '/?s=' + s.token;
      const copy = (text, b) => { const done = () => { const old = b.textContent; b.textContent = 'Copied'; setTimeout(() => { b.textContent = old; }, 1200); }; try { navigator.clipboard.writeText(text).then(done, () => {}); } catch (e) { /* the links are also shown as text */ } };
      let current = null;   // a class id, or 'new'
      const askKey = msg => { const f = $('form', 'tkey', '<h2>Teacher view</h2><p class="quiet">' + esc(msg) + '</p>'); const i = $('input'); i.type = 'password'; i.id = 'tkeyin'; i.setAttribute('aria-label', 'Teacher key'); const b = $('button', 'btn primary', 'Open'); f.append(i, b); f.onsubmit = ev => { ev.preventDefault(); key = i.value.trim(); try { localStorage.setItem('ctree.teacherKey', key); } catch (e) { /* session only */ } load(); }; box.replaceChildren(f); };
      const load = () => T('api/classes').then(r => draw(r.classes)).catch(e => askKey(e.status === 403 && key ? 'That key was not accepted.' : 'Enter the teacher key to open the roster.'));
      const setView = v => { view = v; refresh(course.order.map(n => n.id)); document.body.classList.toggle('classview', !!v); };
      const addForm = cls => {
        const f = $('form', 'tadd'); const name = $('input'); name.type = 'text'; name.id = 'tclassname'; name.placeholder = 'Class name, for example Physics I'; name.setAttribute('aria-label', 'Class name'); name.hidden = !!cls;
        const ta = $('textarea'); ta.id = 'tnames'; ta.rows = 5; ta.placeholder = 'One student per line. Paste a spreadsheet column, or choose a file.'; ta.setAttribute('aria-label', 'Student names');
        const file = $('input'); file.type = 'file'; file.id = 'tfile'; file.accept = '.txt,.csv,text/plain,text/csv'; file.setAttribute('aria-label', 'Roster file');
        file.onchange = () => { const x = file.files[0]; if (x) x.text().then(t => { ta.value = (ta.value ? ta.value + '\n' : '') + t.split(/\r?\n/).map(l => l.split(/[,\t;]/)[0].replace(/^"|"$/g, '').trim()).filter(Boolean).join('\n'); }); };
        const b = $('button', 'btn primary', cls ? 'Add to this class' : 'Create the class');
        f.append($('p', 'quiet', cls ? 'Add students:' : 'Names stay on your own server. Each student gets a personal link that signs them in.'), name, ta, file, b);
        f.onsubmit = ev => { ev.preventDefault(); const names = ta.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean); if (!cls && !name.value.trim()) { name.focus(); return; } T('api/class', { id: cls && cls.id, name: name.value.trim(), names }).then(r => { current = r.cls.id; load(); }); };
        return f;
      };
      const draw = classes => {
        if (current !== 'new' && !classes.some(c => c.id === current)) current = classes.length ? classes[0].id : 'new';
        const cls = classes.find(c => c.id === current);
        const top = $('div', 'trow1', '<h2>Teacher view</h2>'), tabs = $('div', 'seg');
        classes.forEach(c => { const b = btn('segb', esc(c.name) + ' <span class="quiet">' + c.students.length + '</span>'); b.setAttribute('aria-checked', String(c.id === current)); b.onclick = () => { current = c.id; setView(null); draw(classes); }; tabs.append(b); });
        const nb = btn('segb', '+ New class'); nb.setAttribute('aria-checked', String(!cls)); nb.onclick = () => { current = 'new'; setView(null); draw(classes); }; tabs.append(nb);
        top.append(tabs); box.replaceChildren(top);
        if (!cls) { box.append(addForm(null)); return; }
        const vrow = $('div', 'tview'), show = btn('btn primary', 'Show this class on the tree'), who = $('select'); who.id = 'tstudent'; who.setAttribute('aria-label', 'Whose progress to show'); who.hidden = true;
        const missed = $('div', 'tmissed');
        show.onclick = () => T('api/classlog?id=' + encodeURIComponent(cls.id)).then(d => {
          const per = d.students.map(s => ({ s, p: Core.makeProgress(course, { log: s.log, seen: (s.state || {}).seen, flags: (s.state || {}).flags }) }));
          who.replaceChildren(...[['', 'Whole class']].concat(per.map((x, i) => [String(i), x.s.name])).map(([v, t]) => { const o = $('option', '', esc(t)); o.value = v; return o; })); who.hidden = false;
          who.onchange = () => setView({ per, pick: who.value === '' ? null : +who.value });
          setView({ per, pick: null }); show.textContent = 'Refresh';
          const miss = {}, tries = {}; per.forEach(({ s }) => s.log.forEach(e => { if (e.k || !course.nodes[e.n]) return; tries[e.n] = (tries[e.n] || 0) + 1; if (!e.ok) miss[e.n] = (miss[e.n] || 0) + 1; }));
          const worst = Object.keys(miss).sort((a, b) => miss[b] - miss[a]).slice(0, 8);
          missed.replaceChildren($('span', 'quiet', (worst.length ? 'Most missed:' : 'No misses recorded yet.') + ' ' + per.filter(x => x.s.log.length).length + ' of ' + per.length + ' students have started.'), ...worst.map(id => { const b = btn('chip link', esc(course.nodes[id].title) + ' <span class="quiet">' + miss[id] + ' of ' + tries[id] + '</span>'); b.style.setProperty('--h', course.nodes[id].hue); b.onclick = () => focusOn(id); return b; }));
        }).catch(e => { missed.textContent = 'Could not load the class: ' + e.message; });
        const mine = btn('btn', 'Back to my own marks'); mine.onclick = () => { setView(null); who.hidden = true; show.textContent = 'Show this class on the tree'; missed.replaceChildren(); };
        vrow.append(show, who, mine); box.append(vrow, missed);
        const det = $('details', 'troster', '<summary>Roster and personal links <span class="quiet">' + cls.students.length + ' students</span></summary>'); det.open = !cls.students.length;
        const list = $('div', 'tlist');
        cls.students.forEach(s => {
          const row = $('div', 'tstud'); const li = $('input'); li.readOnly = true; li.value = link(s); li.setAttribute('aria-label', 'Personal link for ' + s.name); li.onfocus = () => li.select();
          const cp = btn('linkbtn', 'Copy'), nl = btn('linkbtn', 'New link'), rm = btn('linkbtn', 'Remove');
          cp.onclick = () => copy(link(s), cp);
          nl.title = 'Makes the old link stop working'; nl.onclick = () => T('api/student/relink', { id: s.id }).then(load);
          rm.onclick = () => { if (!rm.dataset.armed) { rm.dataset.armed = 1; rm.textContent = 'Press again to remove'; setTimeout(() => { delete rm.dataset.armed; rm.textContent = 'Remove'; }, 4000); return; } T('api/student/remove', { id: s.id }).then(load); };
          row.append($('span', 'tname', esc(s.name)), li, cp, nl, rm); list.append(row);
        });
        const all = btn('btn', 'Copy every name with its link'); all.onclick = () => copy(cls.students.map(s => s.name + '\t' + link(s)).join('\n'), all);
        det.append(list, all, addForm(cls)); box.append(det);
      };
      load();
    }
  };

  const boot = async () => {
    const tree = document.getElementById('tree'), file = document.getElementById('file');
    const store = makeStore('ctree.v2');
    let texts = [...document.querySelectorAll('script.course')].map(s => s.textContent).filter(t => t.trim()), served = false;
    if (!texts.length) { try { const { files } = await api('api/courses'); texts = await Promise.all(files.map(f => fetch('courses/' + encodeURIComponent(f), { cache: 'no-store' }).then(r => r.text()))); served = true; } catch (e) { /* not on the service */ } }
    if (!texts.length) { tree.textContent = 'No course files were found. Use "Load a course file" below.'; }
    let saved = store.load() || makeStore('ctree.v1.@phys1').load() || {};
    let token = null, who = null;
    if (served) {
      const url = new URL(location.href), t = url.searchParams.get('s');
      if (t) { try { localStorage.setItem('ctree.token', t); } catch (e) { /* this visit only */ } url.searchParams.delete('s'); history.replaceState(null, '', url.pathname + url.search); token = t; }
      else { try { token = localStorage.getItem('ctree.token'); } catch (e) { /* none */ } }
      // A saved copy that belongs to another link is sent to its owner and set aside, so two students on one browser never mix.
      if (token && saved.owner && saved.owner !== token) { const left = (saved.log || []).filter(e => !e.s).map(e => { const o = Object.assign({}, e); delete o.s; return o; }); if (left.length) { try { await api('api/push', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ t: saved.owner, entries: left }) }); } catch (e) { /* the other student's link is gone or the network is */ } } saved = {}; }
      if (token) { try { who = await api('api/me?t=' + encodeURIComponent(token)); saved = mergeRemote(saved, await api('api/pull?t=' + encodeURIComponent(token))); } catch (e) { if (e.status === 401) { who = { error: e.message }; token = null; } else who = { name: 'Signed in', offline: true }; } }
    }
    const teach = served && (location.pathname === '/teach' || new URLSearchParams(location.search).has('teach'));
    const run = (list, nm) => { tree.replaceChildren(); start(Core.mergeCourses(list.map(Core.parseCourse)), { saved, store, token, who, served, teach, name: nm }); };
    file.onchange = () => { const f = [...file.files]; if (f.length) Promise.all(f.map(x => x.text())).then(t => run(t, f.map(x => x.name).join(', '))); };
    if (texts.length) run(texts, '');
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
